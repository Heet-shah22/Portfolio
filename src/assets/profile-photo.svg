<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid in circle -->
  <g opacity="0.12" stroke="#06b6d4" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="350" />
    <line x1="200" y1="20" x2="200" y2="380" />
    <line x1="300" y1="50" x2="300" y2="350" />
    <line x1="50" y1="100" x2="350" y2="100" />
    <line x1="20" y1="200" x2="380" y2="200" />
    <line x1="50" y1="300" x2="350" y2="300" />
  </g>

  <!-- Glowing outer orbit ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6" />
  
  <!-- Stylized Cyber Shield Silhouette -->
  <path d="M200 70 L280 110 V200 C280 255 200 295 200 295 C200 295 120 255 120 200 V110 Z" fill="#0d1525" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" />
  
  <!-- Initials HS -->
  <text x="200" y="210" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="56" font-weight="700" fill="url(#cyberGrad)">HS</text>
  
  <!-- Subtitle -->
  <text x="200" y="242" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="3">HEET SHAH</text>
  <text x="200" y="260" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06b6d4" letter-spacing="1">CYBER SECURITY &amp; CSE</text>

  <!-- Node dots -->
  <circle cx="200" cy="70" r="5" fill="#22d3ee" />
  <circle cx="280" cy="110" r="4" fill="#06b6d4" />
  <circle cx="120" cy="110" r="4" fill="#06b6d4" />
  <circle cx="200" cy="295" r="5" fill="#3b82f6" />
</svg>
