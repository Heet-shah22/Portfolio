      <stop offset="0%" stop-color="#0a0f1c" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>
    <linearGradient id="candleUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="stockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#stockBg)" />

  <!-- Terminal Window Mockup -->
  <rect x="120" y="50" width="560" height="350" rx="12" fill="#0f1626" stroke="#1e293b" stroke-width="2" />
