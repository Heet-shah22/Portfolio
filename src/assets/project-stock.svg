  <text x="340" y="240" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Apache Spark Distributed Transform</text>
  <text x="340" y="263" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">MongoDB Ingestion → Linear Regression</text>
  <text x="340" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Clustering &amp; Statistical Feature Scaling</text>

  <!-- Trend Line -->
  <path d="M 160 270 Q 240 210 320 230 T 480 180 T 630 150" fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#stockGlow)" />
  <circle cx="630" cy="150" r="5" fill="#22d3ee" />

  <!-- Academic Disclaimer Footer -->
