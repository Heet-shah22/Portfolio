  <circle cx="166" cy="70" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="182" cy="70" r="5" fill="#10b981" opacity="0.8" />
  <text x="400" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">spark-analytics.py • Sentiment &amp; Linear Regression</text>

