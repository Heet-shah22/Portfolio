  <rect x="320" y="120" width="320" height="75" rx="8" fill="#16233a" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
  <text x="340" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#22d3ee">NLP &amp; Sentiment Classification</text>
  <text x="340" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">TF-IDF Vectorizer • Positive Score: +0.74</text>
  <text x="340" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">LLM Analytical Commentary Pipeline</text>

