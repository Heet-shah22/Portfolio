<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091419" />
      <stop offset="100%" stop-color="#060c12" />
    </linearGradient>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="ecoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ecoBg)" />
  
  <!-- Subtle grid lines -->
  <g opacity="0.15" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Central Dashboard Mockup Card -->
  <rect x="140" y="60" width="520" height="330" rx="14" fill="#0d1822" stroke="#1e293b" stroke-width="2" />
  <rect x="140" y="60" width="520" height="42" rx="14" fill="#12202c" />
  
  <!-- Window Controls -->
  <circle cx="168" cy="81" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="184" cy="81" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="200" cy="81" r="5" fill="#10b981" opacity="0.8" />
  <text x="400" y="86" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">ecorevive.app • LCA Environmental Tracker</text>

  <!-- Dashboard Metrics Panels -->
  <rect x="170" y="125" width="140" height="80" rx="8" fill="#11222f" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="185" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Carbon Offset</text>
  <text x="185" y="180" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#10b981">42.8 kg CO₂</text>

  <rect x="330" y="125" width="140" height="80" rx="8" fill="#11222f" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="345" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Water Conserved</text>
  <text x="345" y="180" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#06b6d4">1,850 L</text>

  <rect x="490" y="125" width="140" height="80" rx="8" fill="#11222f" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="505" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Credit System</text>
  <text x="505" y="180" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8">350 Pts</text>

  <!-- Chart representation -->
  <path d="M 180 320 Q 260 260 340 280 T 500 240 T 610 220" fill="none" stroke="url(#ecoGrad)" stroke-width="3.5" filter="url(#ecoGlow)" />
  <circle cx="180" cy="320" r="4" fill="#10b981" />
  <circle cx="340" cy="280" r="4" fill="#10b981" />
  <circle cx="500" cy="240" r="4" fill="#06b6d4" />
  <circle cx="610" cy="220" r="5" fill="#38bdf8" />
  <text x="400" y="360" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">LCA Time-Series Aggregation Pipeline</text>
</svg>
